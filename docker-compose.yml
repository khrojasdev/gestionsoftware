# Trazo en local con Docker Desktop:  docker compose up --build
# Abre http://localhost:8000  (usuarios de demostración en el README).
name: trazo

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trazo_db}
      POSTGRES_USER: ${POSTGRES_USER:-trazo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trazo_local_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - trazo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trazo_app} -d ${POSTGRES_DB:-trazo_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Solo para uso local. En un despliegue real define AUTH_SECRET en .env o en el proveedor.
      AUTH_SECRET: ${AUTH_SECRET:-trazo-local-solo-desarrollo-cambiar-0123456789}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trazo_app}:${POSTGRES_PASSWORD:-trazo_local_password}@db:5432/${POSTGRES_DB:-trazo_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
      DEMO_SEED: ${DEMO_SEED:-true}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - trazo_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trazo_postgres_data:
    name: trazo_postgres_data
  trazo_uploads:
    name: trazo_uploads
